name: My first flow
on: workflow_dispatch
jobs:
  my-first-job:
    runs-on: ubuntu-latest
    steps:
      - name: List all files
        run: ls -a

      - name: Print Working Directory
        run: pwd

      - name: Create JS file
        run: echo 'console.log("Hello World!")'; > app.js

      - name: List all files
        run: ls -a

      - name: Run Node.js File
        run: node app.js
